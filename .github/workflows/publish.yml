name: Publish to npm (with provenance)

# n8n verified community nodes must be published via GitHub Actions with an npm
# provenance statement (required from 2026-05-01). Publishing from a local
# machine is not accepted for verification.
#
# Triggers on a pushed `v*` tag (e.g. `v0.3.1`). Set the `NPM_TOKEN` repo secret
# (a granular npm access token with publish rights).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci --ignore-scripts

      - run: npm run lint
      - run: npm run build
      - run: npm test

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
