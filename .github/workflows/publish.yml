name: Publish to npm (with provenance)

# n8n verified community nodes must be published via GitHub Actions with an npm
# provenance statement (required from 2026-05-01). Publishing from a local
# machine is not accepted for verification.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # --ignore-scripts avoids compiling native transitive deps (e.g.
      # isolated-vm, pulled in by n8n-workflow) that we never use — lint,
      # build, tests and publish need only the JS/type sources.
      - run: npm ci --ignore-scripts

      - run: npm run lint

      - run: npm run build

      - run: npm run test:unit

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
